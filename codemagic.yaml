workflows:
  ios-workflow:
    name: Cricket Scorer iOS
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build React app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/CricketScorer.xcarchive" \
            archive

    artifacts:
      - $CM_BUILD_DIR/CricketScorer.xcarchive